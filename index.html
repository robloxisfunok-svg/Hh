<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#080909" />
<title>Urus SE — Vehicle Control</title>
<style>
  :root{
    --bg:#070808;
    --panel:#0d0f10;
    --panel2:#111315;
    --line:rgba(255,255,255,.13);
    --muted:#8c9299;
    --text:#f1f2f3;
    --gold:#d2a537;
    --green:#54b857;
    --danger:#da6767;
    --shadow:0 18px 55px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#020303;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
  body{display:flex;justify-content:center;overflow-x:hidden}
  button,input{font:inherit}
  .app{
    width:min(100%,470px);
    min-height:100vh;
    position:relative;
    background:
      radial-gradient(circle at 80% 4%,rgba(90,96,100,.28),transparent 20%),
      linear-gradient(180deg,#090a0a 0%,#050606 50%,#080909 100%);
    box-shadow:var(--shadow);
    overflow:hidden;
    padding-bottom:92px;
  }
  .app-header{
    height:88px;
    border-bottom:1px solid var(--line);
    display:grid;
    grid-template-columns:52px 1fr 52px;
    align-items:center;
    padding:10px 19px 0;
    background:linear-gradient(100deg,rgba(4,5,5,.92),rgba(35,39,41,.72));
    position:sticky;top:0;z-index:30;backdrop-filter:blur(18px);
  }
  .title-wrap{display:flex;justify-content:center;align-items:center;gap:10px}
  .title{font-size:24px;font-weight:650;letter-spacing:.02em}
  .chev{width:13px;height:13px;border-right:2px solid #eee;border-bottom:2px solid #eee;transform:rotate(45deg) translateY(-4px)}
  .icon-btn{width:44px;height:44px;border:0;background:transparent;color:#fff;display:grid;place-items:center;border-radius:50%}
  .icon-btn:active{background:rgba(255,255,255,.08)}
  .update{padding:16px 17px 0;color:#8e9398;font-size:14px;letter-spacing:.02em}
  .hero{position:relative;height:340px;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
  .hero:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 64%,rgba(133,140,145,.17),transparent 53%)}
  .car{position:absolute;width:104%;max-width:none;left:-2%;top:10px;filter:contrast(1.04) brightness(.97);pointer-events:none;user-select:none}
  .vehicle-shadow{position:absolute;width:74%;height:28px;left:13%;bottom:14px;background:rgba(0,0,0,.75);filter:blur(18px);border-radius:50%}
  .fuel-row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;padding:0 18px 22px;margin-top:-4px}
  .fuel-main{min-width:0}
  .label-row{display:flex;gap:12px;align-items:center;margin-bottom:4px}
  .eyebrow{font-size:12px;letter-spacing:.11em;color:#a6aaae;text-transform:uppercase}
  .fuel-value,.range-value{font-size:28px;letter-spacing:.02em;font-variant-numeric:tabular-nums;cursor:pointer;border-radius:8px}
  .editable:hover{outline:1px dashed rgba(210,165,55,.45);outline-offset:4px}
  .fuel-icon{width:23px;height:23px;flex:none}
  .bar-wrap{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:10px}
  .bar{height:5px;border-radius:99px;background:#26292b;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02)}
  .bar-fill{height:100%;width:70%;background:#f4f4f4;border-radius:inherit;transition:width .7s cubic-bezier(.22,.85,.25,1)}
  .range{text-align:right;min-width:112px}
  .range .eyebrow{margin-bottom:6px}
  .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:0 16px 18px}
  .control{
    height:104px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(160deg,rgba(21,23,24,.96),rgba(9,10,10,.96));
    color:#d8dbdd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);transition:.18s ease;
  }
  .control svg{width:29px;height:29px;stroke:currentColor}
  .control span{font-size:14px;letter-spacing:.03em}
  .control:active{transform:scale(.97);background:#151718}
  .control.active{color:#fff;border-color:rgba(210,165,55,.64);box-shadow:inset 0 0 25px rgba(210,165,55,.08),0 0 0 1px rgba(210,165,55,.12)}
  .control.alert{animation:pulse .45s ease 2}
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(210,165,55,.12)}}
  .card{margin:0 16px 15px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:linear-gradient(160deg,rgba(15,17,18,.97),rgba(7,8,8,.97));box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
  .card-title{font-size:16px;letter-spacing:.08em;text-transform:uppercase;font-weight:550}
  .climate{height:148px;position:relative;padding:18px 18px;display:flex;justify-content:space-between;align-items:center}

  .map-wrap:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 30px 0 34px rgba(6,7,7,.58);background:linear-gradient(180deg,rgba(0,0,0,.07),rgba(0,0,0,.16))}
  .map-pin{position:absolute;z-index:3;left:50%;top:48%;transform:translate(-50%,-100%);width:34px;height:40px;filter:drop-shadow(0 6px 7px rgba(0,0,0,.6))}
  .map-pin:before{content:"";position:absolute;left:5px;top:2px;width:24px;height:24px;border:2px solid var(--gold);background:#101110;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
  .map-pin:after{content:"L";position:absolute;left:12px;top:7px;color:var(--gold);font-weight:800;font-size:13px}
  .bottom-nav{position:fixed;z-index:40;bottom:0;width:min(100%,470px);height:82px;background:rgba(6,7,7,.94);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 9px 8px}
  .nav{border:0;background:transparent;color:#7b8085;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px}
  .nav svg{width:25px;height:25px;stroke:currentColor}
  .nav.active{color:var(--gold)}
  .toast{position:fixed;z-index:90;left:50%;bottom:96px;transform:translate(-50%,20px);background:rgba(25,27,28,.96);border:1px solid rgba(255,255,255,.13);padding:10px 14px;border-radius:11px;font-size:13px;opacity:0;pointer-events:none;transition:.22s ease;white-space:nowrap;box-shadow:0 12px 35px rgba(0,0,0,.45)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .modal{position:fixed;z-index:80;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:24px}
  .modal.open{display:flex}
  .dialog{width:min(390px,100%);border:1px solid rgba(255,255,255,.15);background:linear-gradient(160deg,#161819,#090a0a);border-radius:18px;padding:21px;box-shadow:0 25px 80px rgba(0,0,0,.68)}
  .dialog h2{font-size:18px;margin:0 0 7px}
  .dialog p{font-size:12px;color:#90969b;margin:0 0 16px;line-height:1.45}
  .dialog input{width:100%;height:48px;border:1px solid rgba(255,255,255,.14);background:#070808;color:#fff;border-radius:11px;padding:0 13px;outline:none}
  .dialog input:focus{border-color:rgba(210,165,55,.8);box-shadow:0 0 0 3px rgba(210,165,55,.1)}
  .dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .dialog-actions button{height:44px;border-radius:11px;border:1px solid rgba(255,255,255,.13);background:#111314;color:#fff}
  .dialog-actions .save{background:var(--gold);color:#111;border:0;font-weight:700}
  .working{opacity:.6;pointer-events:none}
  @media (min-width:471px){body{padding:18px 0}.app{border-radius:28px;min-height:calc(100vh - 36px)}.bottom-nav{bottom:18px;border-radius:0 0 28px 28px}.toast{bottom:113px}}
</style>
</head>

<script>
(() => {
  const qs = s => document.querySelector(s);
  const state = {
    fuel: clamp(Number(localStorage.getItem('urusFuel') ?? 70),0,100),
    range: clamp(Number(localStorage.getItem('urusRange') ?? 350),0,2000),
    location: localStorage.getItem('urusLocation') || 'Brickell, Miami, FL',
    locked: localStorage.getItem('urusLocked') !== 'false',
    lights: localStorage.getItem('urusLights') === 'true',
    climate: localStorage.getItem('urusClimate') !== 'false'
  };
  let editing = null;
  let toastTimer;

  function clamp(n,min,max){ return Math.min(max,Math.max(min,Number.isFinite(n)?n:min)); }
  function save(){
    localStorage.setItem('urusFuel',state.fuel);
    localStorage.setItem('urusRange',state.range);
    localStorage.setItem('urusLocation',state.location);
    localStorage.setItem('urusLocked',state.locked);
    localStorage.setItem('urusLights',state.lights);
    localStorage.setItem('urusClimate',state.climate);
  }
  function toast(message){
    const el=qs('#toast'); el.textContent=message; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
  }
  function updateValues(){
    qs('#fuelValue').innerHTML=`${Math.round(state.fuel)}<span style="font-size:.55em;color:#aaa">%</span>`;
    qs('#fuelFill').style.width=`${state.fuel}%`;
    qs('#rangeValue').innerHTML=`${Math.round(state.range).toLocaleString()}<span style="font-size:.5em;color:#aaa"> km</span>`;
    qs('#address').textContent=state.location;
    qs('#mapFrame').src=`https://www.google.com/maps?q=${encodeURIComponent(state.location)}&z=15&output=embed`;
    qs('#lockBtn').classList.toggle('active',state.locked);
    qs('#unlockBtn').classList.toggle('active',!state.locked);
    qs('#lightsBtn').classList.toggle('active',state.lights);
    qs('#climateBtn').classList.toggle('active',state.climate);
    qs('#climateMode').textContent=state.climate?'Cool':'Off';
  }
  function openEditor(type){
    editing=type;
    const input=qs('#editInput');
    const titles={fuel:'Edit fuel level',range:'Edit total range',location:'Edit vehicle location'};
    const helps={fuel:'Enter a number from 0 to 100. The fuel bar moves automatically.',range:'Enter the displayed driving range in kilometers.',location:'Enter an address, neighborhood, or city. The map and local weather will update.'};
    qs('#modalTitle').textContent=titles[type]; qs('#modalHelp').textContent=helps[type];
    input.inputMode=type==='location'?'text':'decimal';
    input.value=type==='fuel'?state.fuel:type==='range'?state.range:state.location;
    qs('#modal').classList.add('open'); setTimeout(()=>{input.focus();input.select()},60);
  }
  function closeEditor(){qs('#modal').classList.remove('open');editing=null;}

  qs('#fuelValue').addEventListener('dblclick',()=>openEditor('fuel'));
  qs('#rangeValue').addEventListener('dblclick',()=>openEditor('range'));
  qs('#address').addEventListener('dblclick',()=>openEditor('location'));
  qs('#cancelBtn').addEventListener('click',closeEditor);
  qs('#modal').addEventListener('click',e=>{if(e.target===qs('#modal'))closeEditor()});
  qs('#editForm').addEventListener('submit',async e=>{
    e.preventDefault(); const value=qs('#editInput').value.trim();
    if(editing==='fuel') state.fuel=clamp(parseFloat(value),0,100);
    if(editing==='range') state.range=clamp(parseFloat(value),0,2000);
    if(editing==='location' && value) state.location=value;
    save(); updateValues(); const changed=editing; closeEditor();
    toast('Vehicle information updated');
    if(changed==='location') await updateWeatherForLocation(state.location);
  });

  function setLock(locked){state.locked=locked;save();updateValues();toast(locked?'Vehicle locked':'Vehicle unlocked')}
  qs('#lockBtn').addEventListener('click',()=>setLock(true));
  qs('#unlockBtn').addEventListener('click',()=>setLock(false));
  qs('#lightsBtn').addEventListener('click',()=>{state.lights=!state.lights;save();updateValues();toast(state.lights?'Lights turned on':'Lights turned off')});
  qs('#hornBtn').addEventListener('click',e=>{e.currentTarget.classList.add('alert');toast('Horn activated');setTimeout(()=>e.currentTarget.classList.remove('alert'),800)});
  qs('#climateBtn').addEventListener('click',()=>{state.climate=!state.climate;save();updateValues();toast(state.climate?'Climate control started':'Climate control stopped')});

  document.querySelectorAll('.nav').forEach(nav=>nav.addEventListener('click',()=>{document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));nav.classList.add('active')}));

  async function updateWeatherForLocation(query){
    const note=qs('#weatherNote'); note.textContent='Local weather: updating…';
    try{
      let lat=25.7617, lon=-80.1918, place='Brickell';
      if(!/brickell|miami/i.test(query)){
        const geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`);
        const gj=await geo.json();
        if(gj.results?.length){lat=gj.results[0].latitude;lon=gj.results[0].longitude;place=gj.results[0].name}
        else place=query.split(',')[0];
      }
      const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,weather_code&temperature_unit=celsius&timezone=auto`);
      const data=await w.json();
      const temp=Math.round(data.current.temperature_2m);
      const feels=Math.round(data.current.apparent_temperature);
      note.textContent=`${place} outside: ${temp}°C · feels ${feels}°C`;
    }catch(err){
      note.textContent='Brickell outside: 29°C · humid';
    }
  }

  const mins=Math.max(0,Math.floor((Date.now()-Number(localStorage.getItem('urusUpdated')||Date.now()))/60000));
  qs('#updatedText').textContent=mins<1?'Updated just now':`Updated ${mins} min ago`;
  localStorage.setItem('urusUpdated',Date.now());
  updateValues(); updateWeatherForLocation(state.location);
})();
</script>
</body>
</html>
